name: default
description: 큰 작업 — 정찰 → 설계(승인) → 구현 → 검토, 되돌아오면 더 강한 모델로 재시도 · 원본에 즉시 반영, 되돌리기 가능
workspace: inplace        # 즉시 반영(원본에서 작업) · 바뀐 파일만 기록해 되돌리기 가능 · copy 로 바꾸면 복사본 작업
auto_apply: true          # copy 로 돌릴 때도 끝나면 자동 적용 (충돌 시에만 대기)
max_run_cost_usd: 2.0    # 넘으면 다음 단계 전에 승인 대기로 멈춤(실패 아님)

# 토큰 정책 (측정 근거는 README "토큰 절약")
# - 모든 단계 system_mode: replace (build 118K → 46K 측정)
# - 설계만 Fable, 나머지는 Haiku/Sonnet. 비싼 모델·effort 는 되돌림(retry) 때만 올린다.
# - 교차 검토 같은 추가 단계는 기본에 넣지 않는다(단계 하나 = 바통 + 도구 정의 + 왕복 전체 비용).
# Claude 사용량이 한도에 가까우면(95%+) 또는 한도 오류가 나면 alternates 로 자동 교체.
stages:
  - name: scout
    provider: claude
    model: haiku
    alternates: [{provider: codex}, {provider: opencode}, {provider: gemini}]
    prompt: ../prompts/scout.md
    tools: [Read, Grep, Glob]
    mcp: [digest]              # 여러 문서·큰 파일은 파일별 요약만 받는다(캐시)
    system_mode: replace
    max_budget_usd: 0.4          # 큰 게임 프로젝트는 탐색이 길다 — 넘으면 실패가 아니라 승인 대기(승인 시 2배)
    timeout_s: 600

  - name: plan
    provider: claude
    model: fable
    fallback_model: opus
    effort: medium
    alternates: [{provider: codex}, {provider: opencode}, {provider: gemini}]
    prompt: ../prompts/plan.md
    tools: [Read, Grep, Glob]
    mcp: [digest]              # 여러 문서·큰 파일은 파일별 요약만 받는다(캐시)
    system_mode: replace
    reads_outputs: [scout]
    gate: human
    max_budget_usd: 1.0

  - name: build
    provider: claude
    model: sonnet
    effort: medium
    retry_model: fable
    retry_effort: high
    fallback_model: opus
    alternates: [{provider: codex}, {provider: opencode}, {provider: gemini}]
    prompt: ../prompts/build.md
    tools: [Read, Grep, Glob, Edit, Write, Bash]
    mcp: [digest]
    # headless 실행은 권한 질문에 답할 수 없다 — 검증 명령만 미리 허용 (프로젝트에 맞게 추가)
    allowed_tools: ["Bash(uv run:*)", "Bash(pytest:*)", "Bash(python:*)", "Bash(python3:*)", "Bash(py:*)", "Bash(node:*)",
                    "Bash(npm test:*)", "Bash(npm run test:*)", "Bash(git diff:*)", "Bash(git status:*)"]
    permission_mode: acceptEdits
    system_mode: replace
    reads_outputs: [plan, review]
    max_budget_usd: 1.0

  - name: review
    provider: claude
    model: sonnet
    effort: low
    alternates: [{provider: codex}, {provider: opencode}, {provider: gemini}]
    prompt: ../prompts/review.md
    tools: [Read, Grep, Glob, Bash]
    mcp: [digest]
    allowed_tools: ["Bash(uv run:*)", "Bash(pytest:*)", "Bash(python:*)", "Bash(python3:*)", "Bash(py:*)", "Bash(node:*)",
                    "Bash(npm test:*)", "Bash(npm run test:*)", "Bash(git diff:*)"]
    system_mode: replace
    reads_outputs: [plan, build]
    on_retry: build
    max_retries: 1
    max_budget_usd: 0.4
