name: studio-campaign
description: 스튜디오 캠페인 — 카태 스튜디오 작업(design/studio/CAMPAIGN.md)을 단계 단위로 끝까지 · 설계·검토 Opus, 정찰·구현 Sonnet (studio-task.yaml) · 시간이 오래 걸림

# campaign.yaml 과 같은 방식. 다른 점:
# - 계획(studio-plan)과 모든 작업(studio-task)이 Opus 로만 돈다. 다른 모델·다른 AI 로 넘어가지 않고,
#   사용량이 바닥나면 기다렸다 계속한다. 노력치는 studio-task.yaml 참고 (설계·구현 xhigh, 정찰·검토 high).
# - 작업 릴레이를 자동 선택하지 않고 studio-task 하나로 고정한다(auto 는 Sonnet 단계가 있는 릴레이를 고를 수 있다).
campaign:
  planner: studio-plan
  task_relay: studio-task
  max_tasks: 20
  max_followups: 1         # 작업당 자동 마무리 1회 (2026-10-10 조정: 2회일 때 런 9개 중 6개가 마무리였다)
  max_cost_usd: 300        # Opus 는 계산상 비용이 크다 — 넘으면 일시 정지, 재개하면 같은 만큼 더 (3단계가 149 를 썼다)
  max_attempts: 2
  model_cap: opus          # 재시도·되돌림에서도 Fable 로 올라가지 않는다
  effort_cap: xhigh        # max 로 올라가지 않는다
