name: demo
description: 비용 0 — 모의 실행으로 화면·흐름 확인

stages:
  - {name: scout, provider: mock, model: haiku, prompt: ../prompts/scout.md}
  - {name: plan, provider: mock, model: fable, prompt: ../prompts/plan.md, reads_outputs: [scout], gate: human}
  - {name: build, provider: mock, model: sonnet, prompt: ../prompts/build.md, reads_outputs: [plan]}
  - {name: review, provider: mock, model: fable, prompt: ../prompts/review.md, reads_outputs: [plan, build], on_retry: build}
