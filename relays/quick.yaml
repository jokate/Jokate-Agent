name: quick
description: 기본 추천 — 작은 작업 단일 주자(Sonnet → 안 되면 Opus/다른 AI) · 복사본 작업 후 패치 반환
workspace: copy
max_run_cost_usd: 0.8

# 한 컨텍스트에 들어가는 일은 단계를 나누면 오히려 비싸다(측정: docs 질의 2단계 63K → 1단계 31K).
stages:
  - name: build
    provider: claude
    model: sonnet
    effort: medium
    fallback_model: opus
    alternates: [{provider: codex}, {provider: opencode}, {provider: gemini}]
    prompt: ../prompts/build.md
    tools: [Read, Grep, Glob, Edit, Write, Bash]
    allowed_tools: ["Bash(uv run:*)", "Bash(pytest:*)", "Bash(python:*)", "Bash(python3:*)", "Bash(py:*)", "Bash(node:*)",
                    "Bash(npm test:*)", "Bash(npm run test:*)", "Bash(git diff:*)", "Bash(git status:*)"]
    permission_mode: acceptEdits
    system_mode: replace
    max_budget_usd: 0.8
