name: campaign
description: 캠페인 — 로드맵·큰 기능을 끝까지. 작업을 순서대로 나눈 뒤 작업마다 릴레이를 자동으로 이어 실행 (남은 이슈는 마무리 작업으로, 사용량이 바닥나면 기다렸다 계속) · 시간이 오래 걸림

# 단계가 없는 캠페인 릴레이. 출발하면 planner 릴레이가 작업 목록을 만들고, 작업마다 task_relay 로 한 번씩 실행한다.
# 같은 세션에서 이어지므로 각 작업은 앞 작업의 인계서를 받는다. 진행·일시정지·재개는 대시보드 세션 화면에서.
campaign:
  planner: campaign-plan   # 작업 목록을 만드는 릴레이 (hidden)
  task_relay: auto         # 작업마다 맞는 릴레이를 자동 선택
  max_tasks: 20
  max_followups: 2         # 작업이 미해결 이슈를 남기면 붙는 마무리 작업 수 (작업당)
  max_cost_usd: 30         # 캠페인 전체 비용 — 넘으면 일시 정지, 재개하면 같은 만큼 더
  max_attempts: 2          # 한 작업이 실패하면 한 번 이어서 다시, 그래도 실패하면 일시 정지
  # model_cap: opus        # 모든 작업의 최고 모델 (haiku|sonnet|opus|fable) — 요청 화면에서 고른 값이 우선
  # effort_cap: high       # 모든 작업의 최고 effort (low|medium|high|xhigh|max)
