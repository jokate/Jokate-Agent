name: studio-task
description: 스튜디오 작업 — 정찰 → 설계 → 구현 → 검토 · 정찰 Sonnet medium, 설계 Opus high, 구현 Sonnet high(되돌림은 Opus), 검토 Opus high (studio-campaign 이 쓰는 내부 릴레이)
hidden: true
workspace: inplace        # 저장소 등록값이 우선한다 (studio-server 는 copy)
auto_apply: true          # copy 로 돌릴 때도 끝나면 자동 적용 (충돌 시에만 대기)
max_run_cost_usd: 40      # 넘으면 다음 단계 전에 승인 대기(실패 아님). auto 방식은 4배까지 묻지 않고 늘린다

# default.yaml 과 같은 단계·프롬프트. 다른 점: 단계마다 모델을 고정하고, 대체(fallback)·다른 AI(alternates)로
# 모델이 바뀌지 않는다. 2026-10-12 owner 결정(주간 사용 창 76%): 정찰과 구현은 Sonnet, 설계와 검토는 Opus high.
# 그 전의 비중은 구현 57% · 설계 21% · 검토 11% · 정찰 11% 였다. 예산과 시간 한도는 넉넉히 잡았다.
stages:
  - name: scout
    provider: claude
    model: sonnet
    effort: medium
    prompt: ../prompts/scout.md
    tools: [Read, Grep, Glob]
    mcp: [digest]              # 여러 문서·큰 파일은 파일별 요약만 받는다(캐시)
    system_mode: replace
    timeout_s: 1800
    stall_s: 900
    max_budget_usd: 6

  - name: plan
    provider: claude
    model: opus
    effort: high
    prompt: ../prompts/plan.md
    tools: [Read, Grep, Glob]
    mcp: [digest]
    system_mode: replace
    reads_outputs: [scout]
    gate: human
    timeout_s: 2400
    stall_s: 900
    max_budget_usd: 12

  - name: build
    provider: claude
    model: sonnet
    effort: high               # 2026-10-12: Opus -> Sonnet (owner 결정). 검토가 되돌려 보낸 재시도는 Opus high
    retry_model: opus
    retry_effort: high
    prompt: ../prompts/build.md
    tools: [Read, Edit, Write, Bash]
    mcp: [digest]
    # headless 실행은 권한 질문에 답할 수 없다 — 검증 명령만 미리 허용
    allowed_tools: ["Bash(uv run:*)", "Bash(pytest:*)", "Bash(python:*)", "Bash(python3:*)", "Bash(py:*)", "Bash(node:*)",
                    "Bash(npm test:*)", "Bash(npm run test:*)", "Bash(git diff:*)", "Bash(git status:*)"]
    permission_mode: acceptEdits
    system_mode: replace
    reads_outputs: [plan, review]
    timeout_s: 5400
    stall_s: 900
    max_budget_usd: 25

  - name: review
    provider: claude
    model: opus
    effort: high
    prompt: ../prompts/review.md
    tools: [Read, Bash]
    mcp: [digest]
    allowed_tools: ["Bash(uv run:*)", "Bash(pytest:*)", "Bash(python:*)", "Bash(python3:*)", "Bash(py:*)", "Bash(node:*)",
                    "Bash(npm test:*)", "Bash(npm run test:*)", "Bash(git diff:*)"]
    system_mode: replace
    reads_outputs: [plan, build]
    on_retry: build
    max_retries: 1
    timeout_s: 2400
    stall_s: 900
    max_budget_usd: 10
