[project]
name = "relay-agent"
version = "0.1.0"
description = "Baton-passing relay agent server: each stage sees only the handoff, not the whole history."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "anthropic>=0.70",
    "mcp>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
relay = "relay_agent.cli:main"

[tool.setuptools]
packages = ["relay_agent", "mcp_servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
