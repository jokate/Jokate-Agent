<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 카태</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #07080d; --bg2: #0c0e16;
  --glass: rgba(255,255,255,.045); --glass-strong: rgba(255,255,255,.08);
  --line: rgba(255,255,255,.09); --line-strong: rgba(255,255,255,.18);
  --ink: #eef0f7; --muted: #8a8fa3; --dim: #5b6075;
  --c1: #7c5cff; --c2: #22d3ee; --c3: #f472b6;
  --ok: #34d399; --warn: #fbbf24; --bad: #fb7185; --run: #60a5fa;
  --grad: linear-gradient(120deg, var(--c1), var(--c2) 55%, var(--c3));
  --shadow: 0 10px 40px rgba(0,0,0,.45);
  --radius: 16px;
}
:root[data-theme="light"] {
  --bg: #f4f5fb; --bg2: #eceef8;
  --glass: rgba(255,255,255,.7); --glass-strong: rgba(255,255,255,.92);
  --line: rgba(20,24,60,.08); --line-strong: rgba(20,24,60,.16);
  --ink: #141833; --muted: #5d6384; --dim: #9aa0bb;
  --shadow: 0 10px 30px rgba(40,50,120,.12);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  font: 14px/1.55 "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif;
  overflow: hidden;
}
/* animated aurora background */
body::before, body::after {
  content: ""; position: fixed; inset: -20%; z-index: -2; pointer-events: none;
  background:
    radial-gradient(40% 35% at 15% 20%, rgba(124,92,255,.28), transparent 70%),
    radial-gradient(35% 30% at 85% 15%, rgba(34,211,238,.20), transparent 70%),
    radial-gradient(40% 40% at 70% 90%, rgba(244,114,182,.18), transparent 70%);
  filter: blur(20px); animation: drift 22s ease-in-out infinite alternate;
}
body::after {
  z-index: -1; inset: 0; animation: none; filter: none;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 44px 44px; mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%); opacity: .5;
}
@keyframes drift { to { transform: translate3d(4%, -3%, 0) rotate(6deg) scale(1.08); } }

.glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(18px) saturate(140%); box-shadow: var(--shadow); }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }

/* header */
/* provider usage strip */
.quota { display: flex; gap: 8px; padding: 8px 14px 0; overflow-x: auto; }
.q { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px); cursor: pointer; transition: .2s; min-width: 150px; }
.q:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.q .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; background: var(--dim); }
.q.on .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.q.off { opacity: .55; }
.q.hot .dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
.q .nm { font-weight: 800; font-size: 12.5px; white-space: nowrap; }
.q .sub { font-size: 11px; color: var(--muted); white-space: nowrap; }
.q .wins { display: grid; gap: 3px; min-width: 110px; }
.q .win { display: grid; grid-template-columns: 30px 1fr 34px; gap: 6px; align-items: center; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.q .meter { height: 5px; border-radius: 4px; background: var(--line); overflow: hidden; }
.q .meter i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--ok), var(--warn) 70%, var(--bad)); background-size: 110px 100%; }

/* summary */
.sum-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.sum-head .big { font-size: 26px; line-height: 1; }
.sum-head .line { font-size: 15px; font-weight: 700; line-height: 1.5; }
.sum-grid { display: grid; gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; background: rgba(0,0,0,.14); }
:root[data-theme="light"] .card { background: rgba(255,255,255,.65); }
.card h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.card ul { margin: 0; padding-left: 18px; } .card li { margin: 3px 0; }
.card.warn { border-color: rgba(251,191,36,.5); background: rgba(251,191,36,.08); }
.card.stop { border-color: rgba(251,113,133,.45); background: rgba(251,113,133,.07); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--ok); width: 16px; height: 16px; }
.check.done span { text-decoration: line-through; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-file { font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 3px 8px; border-radius: 8px; background: var(--glass-strong); border: 1px solid var(--line); cursor: pointer; }
.chip-file b { color: var(--ok); font-weight: 600; }
.diagram { overflow: auto; background: rgba(255,255,255,.92); border-radius: 10px; padding: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
/* collapsed tool groups in the timeline */
.ev.group .desc { cursor: pointer; }
.ev.group .list { display: none; margin-top: 6px; border-left: 2px solid var(--line); padding-left: 10px; }
.ev.group.open .list { display: block; }
.ev.group .list div { font-size: 12px; color: var(--muted); padding: 1px 0; word-break: break-all; }
.ev.k-mcp_call .ic { background: rgba(124,92,255,.16); border-color: rgba(124,92,255,.45); }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 20; }
.modal { width: min(760px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; padding: 20px; }
.modal h3 { margin: 0 0 4px; font-size: 18px; }
.pick { padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); margin-bottom: 6px; cursor: pointer; transition: .15s; }
.pick:hover { border-color: var(--c2); background: var(--glass-strong); }
.pick .sub { color: var(--muted); font-size: 12px; }

/* diff */
.diff { font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.45; border-radius: 10px; border: 1px solid var(--line); overflow: auto; max-height: 55vh; background: rgba(0,0,0,.25); }
:root[data-theme="light"] .diff { background: rgba(255,255,255,.7); }
.diff div { padding: 0 10px; white-space: pre; }
.diff .add { background: rgba(52,211,153,.13); color: var(--ok); }
.diff .del { background: rgba(251,113,133,.13); color: var(--bad); }
.diff .hunk { color: var(--c2); } .diff .file { color: var(--ink); font-weight: 700; background: var(--glass-strong); padding: 4px 10px; }
.changes-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.num-add { color: var(--ok); font-weight: 800; } .num-del { color: var(--bad); font-weight: 800; }
.turn.imported .q::before { content: "CC"; background: linear-gradient(120deg, #d97757, #f4a261); font-size: 10px; }
.turn .full { display: none; margin: 8px 0 0 32px; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
.turn.open .full { display: block; } .turn.open .a { display: none; }

header { height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 20px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--glass-strong), transparent); backdrop-filter: blur(14px); }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; white-space: nowrap; }
.orb { width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c3), var(--c1)); animation: spin 6s linear infinite; position: relative; box-shadow: 0 0 24px rgba(124,92,255,.6); }
.orb::after { content: "⚡"; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 15px; animation: spin 6s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.brand small { font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.search { flex: 1; max-width: 520px; margin-left: auto; position: relative; }
.search input { width: 100%; padding: 10px 14px 10px 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); outline: none; transition: .2s; }
.search input:focus { border-color: var(--c1); box-shadow: 0 0 0 4px rgba(124,92,255,.18); }
.search::before { content: "⌕"; position: absolute; left: 13px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 18px; }
.icon-btn { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; display: grid; place-items: center; transition: .2s; }
.icon-btn:hover { border-color: var(--line-strong); transform: translateY(-1px); }

/* layout */
.app { display: grid; grid-template-columns: 280px 14px minmax(320px, 1fr) 14px minmax(360px, 1.15fr); padding: 14px; height: calc(100vh - 64px - 58px); }
/* resizable layout */
.split { position: relative; cursor: col-resize; touch-action: none; }
.split::after { content: ""; position: absolute; top: 20%; bottom: 20%; left: 5px; width: 4px; border-radius: 4px; background: var(--line); transition: background .2s; }
.split:hover::after, .split.drag::after { background: var(--grad); }
.vsplit { flex: 0 0 10px; margin: -12px 0; cursor: row-resize; position: relative; touch-action: none; }
.vsplit::after { content: ""; position: absolute; left: 30%; right: 30%; top: 3px; height: 4px; border-radius: 4px; background: var(--line); }
.vsplit:hover::after, .vsplit.drag::after { background: var(--grad); }
.col.collapsed { visibility: hidden; overflow: hidden; min-width: 0; padding: 0; }  /* keep the grid cell so later columns stay in place */
body.dragging { user-select: none; cursor: col-resize; }
body.dragging-row { user-select: none; cursor: row-resize; }
.layout-btns { display: flex; gap: 6px; }
.layout-btns .icon-btn.on { border-color: var(--c2); box-shadow: 0 0 0 3px rgba(34,211,238,.15); }
select.field option, select.field optgroup { background: var(--bg2); color: var(--ink); }
.hint { color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.picked { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; align-self: center; }
.picker-path { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; padding: 8px 10px; border-radius: 10px; background: var(--glass-strong); border: 1px solid var(--line); margin: 10px 0; word-break: break-all; }
.picker-list { max-height: 48vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
.picker-list div { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
.picker-list div:hover { background: var(--glass-strong); }
.form-grid { display: grid; gap: 10px; }
.form-grid label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.col { min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.panel { padding: 16px; min-height: 0; }
.scroll { overflow: auto; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.label .count { background: var(--glass-strong); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 10px; letter-spacing: 0; }
@media (max-width: 1180px) { body { overflow: auto; } .app { grid-template-columns: 1fr !important; height: auto; row-gap: 14px; } .split, .vsplit, .layout-btns { display: none; } .col.collapsed { visibility: visible; } }

/* forms */
.field { width: 100%; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: rgba(0,0,0,.18); outline: none; transition: .2s; }
:root[data-theme="light"] .field { background: rgba(255,255,255,.8); }
.field:focus { border-color: var(--c2); box-shadow: 0 0 0 4px rgba(34,211,238,.14); }
textarea.field { resize: vertical; min-height: 84px; }
.btn { border: 0; border-radius: 11px; padding: 10px 16px; font-weight: 700; cursor: pointer; transition: transform .15s, box-shadow .2s, filter .2s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--grad); color: #fff; box-shadow: 0 6px 24px rgba(124,92,255,.45); background-size: 180% 100%; animation: sheen 5s ease infinite; }
.btn-primary:hover { filter: brightness(1.1); box-shadow: 0 8px 32px rgba(34,211,238,.45); }
@keyframes sheen { 50% { background-position: 100% 0; } }
.btn-ghost { background: var(--glass-strong); border: 1px solid var(--line); }
.btn-ghost:hover { border-color: var(--line-strong); }
.btn-warn { background: linear-gradient(120deg, #f59e0b, #f472b6); color: #fff; box-shadow: 0 6px 26px rgba(245,158,11,.45); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 6px 36px rgba(244,114,182,.7); } }

/* sessions */
.new-session { display: grid; gap: 8px; }
.new-session > *, .new-session .btn { width: 100%; min-width: 0; }
.new-session .btn { overflow: hidden; text-overflow: ellipsis; }
.new-session .btn small { font-weight: 500; opacity: .6; }
.new-session .picked { padding: 0 4px; }
.new-session .sub-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 4px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.06); }
.session { position: relative; padding: 12px 14px; border-radius: 13px; border: 1px solid transparent; cursor: pointer; transition: .2s; margin-bottom: 6px; }
.session:hover { background: var(--glass-strong); border-color: var(--line); transform: translateX(2px); }
.session.active { background: var(--glass-strong); border-color: transparent; }
.session.active::before { content: ""; position: absolute; inset: 0; border-radius: 13px; padding: 1px; background: var(--grad); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.session .t { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.session .t span { color: var(--muted); font-weight: 600; font-size: 12px; }
.session .s { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { padding: 14px; border-radius: 14px; position: relative; overflow: hidden; }
.stat::after { content: ""; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%; background: var(--accent, var(--c1)); opacity: .18; filter: blur(10px); }
.stat .k { font-size: 11px; color: var(--muted); font-weight: 600; }
.stat .v { white-space: nowrap; font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .ring { position: absolute; right: 12px; bottom: 12px; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(var(--c2) calc(var(--p) * 1%), var(--line) 0); -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%); mask: radial-gradient(circle, transparent 58%, #000 60%); }

/* composer + turns */
.session-head h2 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
.session-head .wd { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; margin-top: 2px; }
.composer { display: grid; gap: 10px; }
.composer .row { display: flex; gap: 8px; min-width: 0; }
.composer select { flex: 1 1 auto; min-width: 0; text-overflow: ellipsis; }
.composer .btn { flex: 0 0 auto; }
.turn { padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.12); cursor: pointer; transition: .2s; margin-bottom: 10px; position: relative; }
:root[data-theme="light"] .turn { background: rgba(255,255,255,.6); }
.turn:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow); }
.turn.active { border-color: var(--c1); box-shadow: 0 0 0 1px var(--c1), 0 10px 40px rgba(124,92,255,.25); }
.turn .q { font-weight: 650; display: flex; gap: 10px; }
.turn .q::before { content: "Q"; flex: 0 0 22px; height: 22px; border-radius: 7px; background: var(--grad); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.turn .a { color: var(--muted); font-size: 13px; margin: 8px 0 0 32px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.turn .meta { display: flex; gap: 8px; align-items: center; margin: 10px 0 0 32px; font-size: 11.5px; color: var(--dim); flex-wrap: wrap; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; border: 1px solid currentColor; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.st-imported { color: #f4a261; } .st-cancelled { color: var(--muted); }
.st-done { color: var(--ok); } .st-failed { color: var(--bad); } .st-awaiting_approval { color: var(--warn); } .st-running { color: var(--run); } .st-pending { color: var(--muted); }
.st-running::before, .st-awaiting_approval::before { animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.tag { padding: 1px 8px; border-radius: 7px; background: var(--glass-strong); border: 1px solid var(--line); color: var(--muted); font-size: 11px; }

/* inspector */
.run-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.run-head .id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
.run-head .spacer { flex: 1; }
.run-goal { font-size: 17px; font-weight: 750; letter-spacing: -.02em; margin: 10px 0 0; }
.err { margin-top: 10px; padding: 10px 12px; border-radius: 11px; background: rgba(251,113,133,.1); border: 1px solid rgba(251,113,133,.35); color: var(--bad); font-size: 13px; }

/* relay track */
.track { position: relative; display: flex; justify-content: space-between; align-items: flex-start; padding: 26px 6px 6px; margin-top: 8px; }
.track .rail { position: absolute; left: 34px; right: 34px; top: 52px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.track .rail .fill { position: absolute; inset: 0 auto 0 0; width: var(--progress, 0%); background: var(--grad); box-shadow: 0 0 18px var(--c2); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.track .rail .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: flow 1.6s linear infinite; }
@keyframes flow { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.node { position: relative; z-index: 1; width: 25%; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.node .dot { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-size: 22px; background: var(--bg2); border: 1px solid var(--line-strong); transition: .3s; position: relative; }
.node .name { font-weight: 800; font-size: 13px; }
.node .sub { font-size: 11px; color: var(--muted); line-height: 1.35; }
.node.done .dot { border-color: var(--ok); box-shadow: 0 0 22px rgba(52,211,153,.35); }
.node.active .dot { border-color: transparent; background: var(--bg2); box-shadow: 0 0 34px rgba(96,165,250,.6); }
.node.active .dot::before { content: ""; position: absolute; inset: -2px; border-radius: 19px; padding: 2px; background: conic-gradient(from var(--a, 0deg), var(--c1), var(--c2), var(--c3), var(--c1)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: rot 1.4s linear infinite; }
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes rot { to { --a: 360deg; } }
.node.waiting .dot { border-color: var(--warn); box-shadow: 0 0 28px rgba(251,191,36,.55); animation: pulse-warn 1.6s infinite; }
@keyframes pulse-warn { 50% { box-shadow: 0 0 44px rgba(251,191,36,.85); } }
.node.failed .dot { border-color: var(--bad); box-shadow: 0 0 28px rgba(251,113,133,.55); }
.node.pending .dot { opacity: .55; }
.node .gate { position: absolute; top: -8px; right: calc(50% - 38px); font-size: 10px; padding: 0 6px; border-radius: 6px; background: var(--warn); color: #1b1300; font-weight: 800; }
.node .laps { position: absolute; top: -8px; left: calc(50% - 38px); font-size: 10px; padding: 0 6px; border-radius: 6px; background: var(--c3); color: #fff; font-weight: 800; }
.baton { position: absolute; top: 40px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; z-index: 2; background: radial-gradient(circle at 35% 35%, #fff, var(--c2) 45%, var(--c1)); box-shadow: 0 0 20px var(--c2), 0 0 40px var(--c1); transition: left .9s cubic-bezier(.2,.8,.2,1); display: grid; place-items: center; font-size: 13px; }
.baton.hide { opacity: 0; }

/* tabs */
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(0,0,0,.2); border: 1px solid var(--line); width: fit-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
:root[data-theme="light"] .tabs { background: rgba(255,255,255,.6); }
.tab { flex: 0 0 auto; white-space: nowrap; border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 700; color: var(--muted); transition: .2s; }
.tab.on { background: var(--glass-strong); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }

/* timeline */
.timeline { position: relative; padding-left: 8px; }
.ev { display: grid; grid-template-columns: 30px 1fr; gap: 12px; position: relative; padding-bottom: 12px; animation: pop .35s ease both; }
.ev:not(:last-child)::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: linear-gradient(var(--line-strong), transparent); }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } }
.ev .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 14px; background: var(--glass-strong); border: 1px solid var(--line); }
.ev .body { min-width: 0; }
.ev .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ev .kind { font-weight: 750; font-size: 13px; }
.ev .stage { font-size: 11px; color: var(--c2); font-weight: 700; }
.ev .time { margin-left: auto; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.ev .desc { color: var(--muted); font-size: 12.5px; word-break: break-all; }
.ev .desc code { font-family: ui-monospace, Consolas, monospace; color: var(--ink); background: var(--glass-strong); padding: 1px 6px; border-radius: 6px; font-size: 12px; }
.ev.k-stage_started .ic { background: rgba(96,165,250,.15); border-color: rgba(96,165,250,.4); }
.ev.k-stage_finished .ic { background: rgba(52,211,153,.14); border-color: rgba(52,211,153,.4); }
.ev.k-awaiting_approval .ic, .ev.k-sent_back .ic, .ev.k-budget_exceeded .ic, .ev.k-model_fallback .ic { background: rgba(251,191,36,.14); border-color: rgba(251,191,36,.45); }
.ev.k-run_failed .ic, .ev.k-tool_error .ic { background: rgba(251,113,133,.14); border-color: rgba(251,113,133,.45); }
.ev.k-run_done .ic { background: var(--grad); border: 0; }

/* handoff markdown */
.md { font-size: 13.5px; }
.md h1 { font-size: 18px; margin: 0 0 8px; } .md h2 { font-size: 14px; margin: 18px 0 6px; color: var(--c2); } .md h3 { font-size: 13px; margin: 12px 0 4px; }
.md ul { margin: 4px 0; padding-left: 18px; } .md li { margin: 2px 0; color: var(--ink); }
.md p { margin: 4px 0; color: var(--ink); }
.md code { font-family: ui-monospace, Consolas, monospace; background: var(--glass-strong); padding: 1px 6px; border-radius: 6px; font-size: 12px; }
.md pre { background: rgba(0,0,0,.3); padding: 10px; border-radius: 10px; overflow: auto; }

/* usage bars */
.bars { display: grid; gap: 12px; }
.bar-row .top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
.bar-row .top b { font-variant-numeric: tabular-nums; }
.bar-track { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; background: var(--grad); box-shadow: 0 0 14px rgba(34,211,238,.4); transition: width .8s cubic-bezier(.2,.8,.2,1); }

.empty { display: grid; place-items: center; text-align: center; color: var(--muted); padding: 36px 12px; gap: 6px; }
.empty .big { font-size: 34px; filter: drop-shadow(0 0 16px rgba(124,92,255,.6)); }
.toast { position: fixed; right: 20px; bottom: 20px; padding: 12px 16px; border-radius: 12px; background: var(--glass-strong); border: 1px solid var(--line-strong); backdrop-filter: blur(16px); box-shadow: var(--shadow); transform: translateY(20px); opacity: 0; transition: .3s; z-index: 10; }
.toast.show { transform: none; opacity: 1; }
.toast.bad { border-color: var(--bad); color: var(--bad); }
  .stage-models { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .stage-models:empty { display: none; }
  .stage-models label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted, #9aa); }
  .stage-models label b { font-weight: 600; }
  .stage-models select { width: 100%; }
  .stage-models select.chosen { border-color: var(--accent, #7cf); }
  /* the AI's own words, the user's cut-ins */
  .ev.say .desc { color: var(--ink); background: var(--glass-strong); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px;
    padding: 8px 11px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; font-size: 13px; line-height: 1.55; }
  .ev.say.clip .desc { max-height: 96px; }
  .ev.me .desc { border-radius: 12px 4px 12px 12px; border-color: var(--c2); background: color-mix(in srgb, var(--c2) 12%, transparent); }
  .ev.answer .desc { border-color: var(--c1, #8b7cff); }
  .interject { display: flex; gap: 8px; align-items: stretch; margin-bottom: 12px; }
  .interject textarea { flex: 1; min-height: 44px; height: 44px; resize: vertical; }
  .interject .btn { align-self: flex-end; }
  .interject[hidden] { display: none; }
  /* the composer grows with its panel (drag the bar below it) */
  #sessionPanel { display: flex; flex-direction: column; }
  #sessionPanel .composer { flex: 1 1 auto; grid-template-rows: minmax(84px, 1fr) auto; min-height: 0; }
  #sessionPanel .composer textarea { height: 100%; }
  .tw-stage { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .tw-stage h4 { margin: 0 0 6px; font-size: 13px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tw-stage .muted { color: var(--muted); font-size: 12px; }
  .tw-warn { color: #ffb86b; font-size: 12.5px; margin: 4px 0; }
  .tw-spark { display: flex; align-items: flex-end; gap: 2px; height: 42px; margin: 6px 0; }
  .tw-spark i { flex: 1; min-width: 2px; background: var(--grad); border-radius: 2px 2px 0 0; opacity: .85; }
  .tw-table { width: 100%; font-size: 12px; border-collapse: collapse; }
  .tw-table td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  .tw-table td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tw-table code { word-break: break-all; }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="orb"></div><div>Agent <span class="grad-text">카태</span><br><small>relay agent control room</small></div></div>
  <div class="search"><input id="search" placeholder="지금까지 한 질문 검색…  (Enter)"></div>
  <div class="layout-btns">
    <button class="icon-btn" id="tgLeft" title="세션 목록 접기/펴기">⇤</button>
    <button class="icon-btn" id="tgMid" title="질문 이력 접기/펴기">☰</button>
    <button class="icon-btn" id="tgFocus" title="결과만 크게 보기">⛶</button>
    <button class="icon-btn" id="tgReset" title="레이아웃 초기화">↺</button>
  </div>
  <button class="icon-btn" id="theme" title="테마 전환">◐</button>
</header>
<div class="quota" id="quota" title="클릭: 사용량 새로고침"></div>

<div class="app" id="app">
  <!-- sessions -->
  <div class="col" id="colLeft">
    <div class="glass panel" style="flex:0 0 auto">
      <p class="label">새 세션</p>
      <form class="new-session" id="newSession">
        <input class="field" name="title" placeholder="예) HON 캐릭터 작업" required>
        <select class="field" name="repo" id="repoSelect"><option value="">📁 등록된 저장소 선택…</option></select>
        <button type="button" class="btn btn-ghost" id="pickWorkdir">📂 폴더 직접 선택 <small>(등록 안 된 폴더)</small></button>
        <span class="picked" id="workdirLabel" hidden></span>
        <input type="hidden" name="workdir" id="workdirValue">
        <button class="btn btn-primary">＋ 세션 시작</button>
        <div class="sub-actions">
          <button type="button" class="btn btn-ghost" id="addRepo">＋ 저장소 등록</button>
          <button type="button" class="btn btn-ghost" id="ccImport">⤵ Claude Code 가져오기</button>
        </div>
      </form>
    </div>
    <div class="glass panel scroll" style="flex:1">
      <p class="label">세션 <span class="count" id="sessionCount">0</span></p>
      <div id="sessions"></div>
    </div>
  </div>

  <div class="split" data-split="1" title="드래그: 너비 조절 · 더블클릭: 기본값"></div>
  <!-- session -->
  <div class="col" id="colMid">
    <div class="stats" id="stats"></div>
    <div class="glass panel scroll" id="sessionPanel" style="flex:0 0 auto">
      <div class="empty"><div class="big">🏁</div><div>왼쪽에서 세션을 고르거나 새로 만드세요</div></div>
    </div>
    <div class="vsplit" data-target="sessionPanel" title="드래그: 높이 조절 · 더블클릭: 자동"></div>
    <div class="glass panel scroll" style="flex:1">
      <p class="label" id="turnsLabel">질문 이력 <span class="count" id="turnCount">0</span></p>
      <div id="turns"></div>
    </div>
  </div>

  <div class="split" data-split="2" title="드래그: 너비 조절 · 더블클릭: 기본값"></div>
  <!-- inspector -->
  <div class="col" id="colRight">
    <div class="glass panel scroll" id="runPanel" style="flex:0 0 auto">
      <div class="empty"><div class="big">⚡</div><div>질문을 고르면 릴레이가 어떻게 진행됐는지 보여드립니다</div></div>
    </div>
    <div class="vsplit" data-target="runPanel" title="드래그: 높이 조절 · 더블클릭: 자동"></div>
    <div class="glass panel scroll" style="flex:1">
      <div class="interject" id="interject" hidden>
        <textarea class="field" id="ijText" placeholder="진행 중인 AI 에게 추가 지시 (Ctrl+Enter) — 지금 대화에 바로 끼어듭니다"></textarea>
        <button class="btn btn-primary" id="ijSend">💬 끼어들기</button>
      </div>
      <div class="tabs" id="tabs" style="margin-bottom:14px">
        <button class="tab on" data-tab="summary">요약</button>
        <button class="tab" data-tab="timeline">작업 타임라인</button>
        <button class="tab" data-tab="handoff">HANDOFF</button>
        <button class="tab" data-tab="changes">변경 사항</button>
        <button class="tab" data-tab="usage">토큰 감시</button>
      </div>
      <div id="tab-summary"></div>
      <div id="tab-timeline" class="timeline" hidden></div>
      <div id="tab-handoff" class="md" hidden></div>
      <div id="tab-changes" hidden></div>
      <div id="tab-usage" hidden></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtN = (n) => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n ?? 0);
const fmt$ = (n) => "$" + (n ?? 0).toFixed(n >= 1 ? 2 : 4);
let TOKEN = "";
try { TOKEN = localStorage.getItem("katae-token") || ""; } catch {}
async function api(path, opts = {}, retried = false) {
  const headers = { "Content-Type": "application/json", ...(TOKEN ? { Authorization: `Bearer ${TOKEN}` } : {}) };
  const res = await fetch(path, { ...opts, headers });
  if ((res.status === 401 || res.status === 403) && !retried) {
    const entered = prompt("Agent 카태 접근 토큰 (서버의 auth_token / KATAE_TOKEN)");
    if (entered) {
      TOKEN = entered.trim();
      try { localStorage.setItem("katae-token", TOKEN); } catch {}
      return api(path, opts, true);
    }
  }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return (res.headers.get("content-type") || "").includes("json") ? res.json() : res.text();
}
function toast(msg, bad = false) {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast", 2800);
}

/* theme */
try { const saved = localStorage.getItem("katae-theme"); if (saved) document.documentElement.dataset.theme = saved; } catch {}
$("theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("katae-theme", next); } catch {}
};

const STATUS_KO = { done: "완료", failed: "실패", awaiting_approval: "승인 대기", running: "진행 중", pending: "대기", cancelled: "취소됨", imported: "가져옴" };
const EV = {
  run_created: ["🏁", "릴레이 출발"], stage_started: ["🏃", "단계 시작"], tool_use: ["🛠️", "도구 사용"],
  tool_error: ["⚠️", "도구 오류"], note: ["💬", "메모"], stage_finished: ["✅", "단계 완료"],
  sent_back: ["↩️", "되돌림"], awaiting_approval: ["✋", "승인 대기"], approved: ["👍", "승인됨"],
  run_done: ["🏆", "릴레이 완주"], run_failed: ["💥", "실패"], budget_exceeded: ["💸", "예산 도달"], stage_budget_exceeded: ["💸", "단계 한도 도달"], model_exhausted: ["🪫", "모델 사용량 소진"], workspace_forced: ["⚡", "원본에서 작업"], changes_auto_applied: ["✅", "자동 적용"], auto_apply_failed: ["⚠️", "자동 적용 보류"], model_substituted: ["↘️", "모델 대체"],
  model_fallback: ["🔀", "모델 전환"], mcp_call: ["🔌", "MCP 호출"], tool_result_large: ["🐘", "큰 도구 결과"], provider_switch: ["🔁", "AI 교체"], provider_exhausted: ["🪫", "사용량 소진"],
  providers_skipped: ["⏭️", "건너뛴 AI"], stage_skipped: ["⏭️", "단계 건너뜀"], run_cancelled: ["⛔", "취소됨"],
  workspace_ready: ["📦", "작업 공간 준비"], changes_ready: ["🧾", "변경 사항 준비"], changes_applied: ["✅", "원본에 적용"],
  changes_discarded: ["🗑️", "변경 폐기"], changes_rolled_back: ["⏪", "되돌림 완료"], workspace_error: ["⚠️", "작업 공간 오류"],
  note: ["🤖", "AI"], thinking: ["💭", "AI 생각"], stage_answer: ["🎯", "단계 결론"], user_interject: ["🙋", "내 추가 지시"],
  user_notes_applied: ["📌", "추가 지시 반영"], result_repaired: ["🩹", "결과 형식 복구"], prompt_breakdown: ["📤", "보낸 프롬프트"],
  token_report: ["🔥", "토큰 사용 내역"],
};
const PROVIDER_LABEL = { claude: "Claude", codex: "Codex", opencode: "OpenCode", gemini: "Gemini", anthropic_api: "Claude API", openai: "OpenAI", openrouter: "OpenRouter", ollama: "Ollama", mock: "Mock" };
const WINDOW_LABEL = { five_hour: "5h", seven_day: "7d", seven_day_opus: "7d·Opus", seven_day_sonnet: "7d·Son" };
const TOOL_IC = { Read: "📖", Grep: "🔎", Glob: "🗂️", Edit: "✏️", Write: "📝", Bash: "⌨️", WebFetch: "🌐", WebSearch: "🌐" };
const STAGE_IC = { scout: "🔭", plan: "🧭", build: "🔧", review: "🧪", answer: "💡" };

let S = { session: null, run: null, lastEvent: 0, timer: null, tab: "summary", failures: 0, group: null };

function addToGroup(tl, e) {
  // consecutive tool calls of one stage fold into a single row: "도구 7회 · Read 3 · Edit 2 ..."
  if (!S.group || S.group.stage !== e.stage || !S.group.el.isConnected) {
    tl.insertAdjacentHTML("beforeend", `
      <div class="ev group k-tool_use"><div class="ic">🛠️</div>
        <div class="body"><div class="top"><span class="kind">도구 사용</span><span class="stage">${esc(e.stage)}</span><span class="time">${e.at.slice(11, 19)}</span></div>
        <div class="desc"><span class="counts"></span> <span style="color:var(--dim)">▸ 펼치기</span><div class="list"></div></div></div></div>`);
    const el = tl.lastElementChild;
    el.querySelector(".desc").onclick = () => el.classList.toggle("open");
    S.group = { stage: e.stage, el, counts: {} };
  }
  const g = S.group, d = e.detail;
  const name = e.kind === "note" ? "메모" : d.tool;
  g.counts[name] = (g.counts[name] || 0) + 1;
  const total = Object.entries(g.counts).filter(([k]) => k !== "메모").reduce((a, [, v]) => a + v, 0);
  g.el.querySelector(".counts").textContent = `${total}회 · ` + Object.entries(g.counts).map(([k, v]) => `${k} ${v}`).join(" · ");
  g.el.querySelector(".list").insertAdjacentHTML("beforeend",
    `<div>${e.kind === "note" ? "💬 " + esc(d.text) : `${TOOL_IC[d.tool] || "🛠️"} <code>${esc(d.tool)}</code> ${esc(d.target || "")}`}</div>`);
}

let MERMAID = null;
async function renderDiagram(el, src) {
  try {
    MERMAID = MERMAID || (await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs")).default;
    MERMAID.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" });
    const { svg } = await MERMAID.render("mm" + Math.random().toString(36).slice(2), src);
    el.innerHTML = svg;
  } catch (err) {
    el.innerHTML = `<pre>${esc(src)}</pre>`;  // offline or invalid diagram: show the source instead
  }
}

async function renderSummary(runId) {
  let s;
  try { s = await api(`/runs/${runId}/summary`); } catch { return; }
  if (runId !== S.run) return;
  const box = $("tab-summary");
  const icon = { done: "✅", failed: "💥", cancelled: "⛔", awaiting_approval: "✋", running: "🏃", pending: "⏳" }[s.status] || "•";
  const checksKey = `katae-checks-${s.id}`;
  let checked = {};
  try { checked = JSON.parse(localStorage.getItem(checksKey) || "{}"); } catch {}
  const cards = [];
  if (s.stop) {
    const st = s.stop;
    cards.push(`<div class="card stop"><h4>⏸ 중단 지점 — ${esc(st.stage)}</h4>
      <div class="kv"><span>사유</span><span>${esc(st.reason)}</span>
      ${st.done_stages.length ? `<span>끝난 단계</span><span>${st.done_stages.map(esc).join(" → ")}</span>` : ""}
      ${st.remaining_stages.length ? `<span>남은 단계</span><span>${st.remaining_stages.map(esc).join(" → ")}</span>` : ""}
      ${st.partial_actions.length ? `<span>이미 한 일</span><span>${st.partial_actions.map(esc).join("<br>")}</span>` : ""}
      <span>이어가기</span><span>${esc(st.resume_hint)}</span></div></div>`);
  }
  if (s.user_checks.length) {
    cards.push(`<div class="card warn"><h4>☑ 사용자가 확인할 것 <span class="count">${s.user_checks.length}</span></h4>
      ${s.user_checks.map((c, i) => `<label class="check ${checked[i] ? "done" : ""}"><input type="checkbox" data-i="${i}" ${checked[i] ? "checked" : ""}><span>${esc(c)}</span></label>`).join("")}</div>`);
  }
  if (s.highlights.length) {
    cards.push(`<div class="card"><h4>핵심 작업</h4><ul>${s.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul></div>`);
  }
  if (s.diagram) {
    cards.push(`<div class="card"><h4>그림 <span class="tag">${esc(s.diagram_stage)}</span></h4><div class="diagram" id="sumDiagram"></div></div>`);
  }
  const ch = s.changes;
  if (ch.files.length) {
    cards.push(`<div class="card"><h4>바뀐 파일 <span class="num-add">+${ch.insertions}</span> <span class="num-del">-${ch.deletions}</span>
      <span class="tag">${ch.mode === "copy" ? "복사본" : "원본"} · ${esc(ch.status)}</span></h4>
      <div class="chips">${ch.files.map((f) => `<span class="chip-file" title="${esc(f.delta)}">${esc(f.path)} <b>${esc(f.delta.split(" ")[0])}</b></span>`).join("")}</div></div>`);
  }
  const mcp = Object.entries(s.mcp);
  const tools = Object.entries(s.tools);
  cards.push(`<div class="card"><h4>검증 · 사용량</h4><div class="kv">
    ${s.verification.length ? `<span>검증 명령</span><span>${s.verification.map((c) => `<code>${esc(c)}</code>`).join(" ")}</span>` : `<span>검증 명령</span><span style="color:var(--warn)">실행 기록 없음</span>`}
    ${tools.length ? `<span>도구</span><span>${tools.map(([k, v]) => `${esc(k)} ${v}`).join(" · ")}</span>` : ""}
    ${mcp.length ? `<span>MCP</span><span>${mcp.map(([k, v]) => `<code>${esc(k)}</code> ×${v.calls} (${fmtN(v.result_chars)}자${v.errors ? `, 오류 ${v.errors}` : ""})`).join(" · ")}</span>` : ""}
    ${s.large_results.length ? `<span>큰 결과</span><span>${s.large_results.map((r) => `${esc(r.tool)} ${fmtN(r.chars)}자`).join(" · ")}</span>` : ""}
    <span>비용</span><span>${fmt$(s.cost_usd)} · ${fmtN(s.tokens)} 토큰 · ${s.stages.map((x) => `${esc(x.stage)}(${esc(x.model)})`).join(" → ")}</span>
    ${s.open_issues.length ? `<span>남은 이슈</span><span>${s.open_issues.map(esc).join("<br>")}</span>` : ""}
  </div></div>`);
  box.innerHTML = `<div class="sum-head"><div class="big">${icon}</div><div><div class="line">${esc(s.headline || s.state)}</div>
    <div style="color:var(--muted);font-size:12px;margin-top:2px">${s.repo ? `📁 ${esc(s.repo)} · ` : ""}${esc(s.goal)}</div></div></div>
    <div class="sum-grid">${cards.join("")}</div>`;
  box.querySelectorAll(".check input").forEach((cb) => cb.onchange = () => {
    checked[cb.dataset.i] = cb.checked;
    cb.closest(".check").classList.toggle("done", cb.checked);
    try { localStorage.setItem(checksKey, JSON.stringify(checked)); } catch {}
  });
  box.querySelectorAll(".chip-file").forEach((c) => c.onclick = () => document.querySelector('[data-tab="changes"]').click());
  if (s.diagram) renderDiagram($("sumDiagram"), s.diagram);
}

function describe(e) {
  const d = e.detail;
  switch (e.kind) {
    case "tool_use": return `<code>${esc(d.tool)}</code> ${esc(d.target || "")}`;
    case "stage_started": return `${d.escalated ? "⬆️ 재시도 강화 · " : ""}${esc(d.model)} · ${esc(d.runner)}${d.effort ? " · effort " + esc(d.effort) : ""}${d.reads?.length ? " · 읽는 산출물 " + d.reads.map(esc).join(", ") : ""}`;
    case "stage_finished": return `<b class="st-${d.verdict === "pass" ? "done" : d.verdict === "retry" ? "awaiting_approval" : "failed"}">${esc(d.verdict)}</b> · ${fmtN(d.input_tokens)} in / ${fmtN(d.output_tokens)} out${d.cost_usd != null ? " · " + fmt$(d.cost_usd) : ""} · ${(d.duration_ms / 1000).toFixed(1)}s<br>${esc(d.summary)}`;
    case "sent_back": return `→ <code>${esc(d.to)}</code> #${d.attempt} · ${(d.issues || []).map(esc).join(" / ")}`;
    case "awaiting_approval": return `다음 단계 <code>${esc(d.next)}</code> 전에 확인이 필요합니다`;
    case "run_created": return (d.stages || []).map((s) => `<code>${esc(s)}</code>`).join(" → ");
    case "model_fallback": return `<code>${esc(d.from)}</code> → <code>${esc(d.to)}</code> · ${esc(d.reason)}`;
    case "provider_switch": return `→ <code>${esc(PROVIDER_LABEL[d.to] || d.to)}</code> · ${esc(d.reason)}`;
    case "provider_exhausted": return `<code>${esc(PROVIDER_LABEL[d.provider] || d.provider)}</code> ${d.until ? esc(d.until.slice(11, 16)) + " 까지 제외" : ""}`;
    case "providers_skipped": return (d.skipped || []).map((s) => `<code>${esc(PROVIDER_LABEL[s.provider] || s.provider)}</code> ${esc(s.reason)}`).join("<br>");

    case "changes_ready": return `${d.files}개 파일 · <span class="num-add">+${d.insertions}</span> <span class="num-del">-${d.deletions}</span> — '변경 사항' 탭에서 확인`;
    case "workspace_error": return esc(d.error);
    case "mcp_call": return `<code>${esc(d.server)}.${esc(d.tool)}</code> ${esc(d.target || "")}<span class="mcp-size"></span>`;
    case "tool_result_large": return `<code>${esc(d.tool)}</code> ${esc(d.target || "")} · 결과 ${fmtN(d.chars)}자 (토큰 소모 큼)`;
    case "run_failed": return esc(d.error);
    case "workspace_forced": return esc(d.reason);
    case "changes_auto_applied": return `${d.files}개 파일을 원본에 자동 적용`;
    case "auto_apply_failed": return `원본이 그사이 바뀌어 자동 적용하지 않음 — '변경 사항' 탭에서 확인 · ${esc(d.error)}`;
    case "model_exhausted": return `<code>${esc(d.model)}</code> 만 소진 — 같은 AI 에서 아래 모델로 계속${d.until ? ` (${esc(String(d.until).slice(5, 16).replace("T", " "))} 까지)` : ""}`;
    case "model_substituted": return `<code>${esc(d.requested)}</code> 소진 중 → <code>${esc(d.used)}</code> 사용`;
    case "stage_budget_exceeded": return `${esc(d.reason)} — 승인하면 이 단계 한도를 2배로 올려 다시 실행`;
    case "budget_exceeded": return `${fmt$(d.spent_usd)} 사용 / 한도 ${fmt$(d.limit_usd)} — 승인하면 <code>${esc(d.next)}</code> 부터 계속`;
    case "tool_error": return esc(d.message);
    case "note": case "thinking": return esc(d.text);
    case "stage_answer": return esc(d.summary) + (d.verdict && d.verdict !== "pass" ? ` <b>[${esc(d.verdict)}]</b>` : "")
      + (d.open_issues?.length ? "\n· " + d.open_issues.map(esc).join("\n· ") : "");
    case "user_interject": return esc(d.text) + `\n<small>${{ live: "⚡ 진행 중인 AI 대화에 바로 전달됨", next_stage: "⏭️ 다음 단계부터 반영", on_resume: "⏸ 재개할 때 반영" }[d.applied] || ""}</small>`;
    case "user_notes_applied": return (d.notes || []).map(esc).join(" / ") + " — 이 단계 프롬프트에 포함";
    case "result_repaired": return esc(d.reason);
    case "prompt_breakdown": return `약 ${fmtN(d.est_tokens)} 토큰 · 가장 큰 부분: ${esc(Object.keys(d.sections || {})[0] || "-")} (${fmtN(Object.values(d.sections || {})[0] || 0)}자)`;
    case "token_report": return `턴 ${d.turns}회 · 매 턴 다시 읽은 양 합계 ${fmtN(d.reread_tokens)} · 최대 맥락 ${fmtN(d.peak_context)}`
      + (d.top_results?.[0] ? ` · 가장 큰 도구 결과 <code>${esc(d.top_results[0].tool)}</code> ${fmtN(d.top_results[0].chars)}자` : "");
    default: return "";
  }
}

function md(text) {
  const lines = String(text).split("\n"); let html = "", inList = false, inCode = false;
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  for (const line of lines) {
    if (line.startsWith("```")) { html += inCode ? "</pre>" : "<pre>"; inCode = !inCode; continue; }
    if (inCode) { html += esc(line) + "\n"; continue; }
    const li = line.match(/^\s*[-*]\s+(.*)/) || line.match(/^\s*\d+\.\s+(.*)/);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (inList ? "</ul>" : "") + (inCode ? "</pre>" : "");
}

      const def = `기본값 · ${st.model || st.provider}${st.tier ? ` · ${st.tier}` : ""}`;
      const groups = models.filter((p) => !st.writes || p.tools).map((p) => `<optgroup label="${esc(p.label)}${p.tools ? "" : " (읽기 전용)"}">${
        p.models.map((m) => {
          const v = `${p.provider}|${m.model}`;
          const name = m.model ? `${m.model}${m.tier ? ` · ${m.tier}` : ""}` : "기본 모델";
          return `<option value="${esc(v)}" ${m.exhausted_until ? "disabled" : ""} ${saved[st.name] === v && !m.exhausted_until ? "selected" : ""}>${esc(name)}${m.exhausted_until ? " — 소진" : ""}</option>`;
        }).join("")}</optgroup>`).join("");

async function submitAsk(ev) {
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target));
  try {
    const stage_models = {};
    ev.target.querySelectorAll("select[data-stage]").forEach((sel) => {
      if (!sel.value) return;
      const [provider, model] = sel.value.split("|");
      stage_models[sel.dataset.stage] = { provider, model: model || null };
    });
    const run = await api("/runs", { method: "POST", body: JSON.stringify({ ...f, session_id: S.session, stage_models }) });
    toast("🏁 릴레이 출발!");
    await openSession(S.session);
    openRun(run.id);
  } catch (e) { toast(e.message, true); }
}

/* run inspector */
async function openRun(runId) {
  clearInterval(S.timer);
  S.run = runId; S.lastEvent = 0; S.group = null;
  $("tab-summary").innerHTML = `<div class="empty"><div class="big">⏳</div>요약 불러오는 중…</div>`;
  $("tab-timeline").innerHTML = "";

function renderTrack(track) {
  const n = track.length;
  let at = track.findIndex((t) => ["active", "waiting", "failed"].includes(t.status));
  const allDone = track.every((t) => t.status === "done");
  const doneCount = track.filter((t) => t.status === "done").length;
  const progress = n > 1 ? Math.min(100, (Math.max(doneCount - (allDone ? 1 : 0), 0) / (n - 1)) * 100) : 100;
  const batonIdx = at >= 0 ? at : allDone ? n - 1 : 0;
  const left = `calc(${(batonIdx + 0.5) / n * 100}%)`;
  return `
    <div class="track" style="--progress:${progress}%">
      <div class="rail"><div class="fill"></div></div>
      <div class="baton ${at < 0 && !allDone ? "hide" : ""}" style="left:${left}">${allDone ? "🏆" : "⚡"}</div>
      ${track.map((t) => `
        <div class="node ${t.status}" style="width:${100 / n}%">
          <div class="dot">${STAGE_IC[t.name] || "◆"}${t.gate ? '<span class="gate">승인</span>' : ""}${t.laps > 1 ? `<span class="laps">×${t.laps}</span>` : ""}</div>
          <div class="name">${esc(t.name)}</div>
          <div class="sub">${t.provider && !["claude", "mock"].includes(t.provider) ? `<b style="color:var(--c3)">${esc(PROVIDER_LABEL[t.provider] || t.provider)}</b> · ` : ""}${esc(t.model || "")}${t.tokens ? `<br>${fmtN(t.tokens)} tok · ${fmt$(t.cost_usd)}` : ""}</div>
        </div>`).join("")}
    </div>`;
}

async function refreshRun(first) {
  const runId = S.run;
  let run, track, events;
  try {
    [run, track, events] = await Promise.all([api(`/runs/${runId}`), api(`/runs/${runId}/track`), api(`/runs/${runId}/events?after=${S.lastEvent}`)]);
    S.failures = 0;
  } catch (e) {
    // one hiccup (server reload, file being replaced) must not stop live updates for good
    if (++S.failures >= 5) { clearInterval(S.timer); toast(e.message, true); }
    return;
  }
  if (runId !== S.run) return;

  const cost = run.history.reduce((a, h) => a + (h.cost_usd || 0), 0);
  $("runPanel").innerHTML = `
    <div class="run-head">
      <span class="pill st-${run.status}">${STATUS_KO[run.status] || run.status}</span>
      <span class="id">${run.id}</span><span class="tag">${fmt$(cost)}</span>
      <span class="spacer"></span>
      ${run.status === "awaiting_approval" ? '<button class="btn btn-warn" id="approve">✋ 확인했어요, 계속 진행</button>' : ""}
      ${["failed", "cancelled"].includes(run.status) ? '<button class="btn btn-ghost" id="resume">↻ 멈춘 단계부터 재개</button>' : ""}
      ${["running", "pending", "awaiting_approval"].includes(run.status) ? '<button class="btn btn-ghost" id="cancelRun">⛔ 취소</button>' : ""}
      ${run.changes_status === "ready" ? `<span class="tag" style="cursor:pointer" id="toChanges">🧾 변경 ${run.changes.files}개 파일</span>` : ""}
    </div>
    <div class="run-goal">${esc(run.baton.goal)}</div>
    ${run.error ? `<div class="err">💥 ${esc(run.error)}</div>` : ""}
    ${renderTrack(track)}`;
  // polling stops while a run is settled, so restart it after approve/resume
  const restart = () => { clearInterval(S.timer); S.timer = setInterval(() => refreshRun(false), 1500); refreshRun(false); };
  if ($("approve")) $("approve").onclick = () => api(`/runs/${runId}/approve`, { method: "POST" }).then(() => { toast("👍 승인 — 다음 주자 출발"); restart(); }).catch((e) => toast(e.message, true));
  if ($("resume")) $("resume").onclick = () => api(`/runs/${runId}/resume`, { method: "POST" }).then(() => { toast("↻ 재개"); restart(); }).catch((e) => toast(e.message, true));
  if ($("cancelRun")) $("cancelRun").onclick = () => confirm("이 릴레이를 취소할까요? 나중에 재개할 수 있습니다.") &&
    api(`/runs/${runId}/cancel`, { method: "POST" }).then(() => { toast("⛔ 취소 요청"); restart(); }).catch((e) => toast(e.message, true));
  if ($("toChanges")) $("toChanges").onclick = () => document.querySelector('[data-tab="changes"]').click();
  $("interject").hidden = !["running", "pending", "awaiting_approval", "failed", "cancelled"].includes(run.status);
  $("ijText").placeholder = run.status === "running"
    ? "진행 중인 AI 에게 추가 지시 (Ctrl+Enter) — 지금 대화에 바로 끼어듭니다"
    : "추가 지시를 남기면 재개·승인할 때 반영됩니다 (Ctrl+Enter)";
  const changesKey = `${run.status}|${run.changes_status}|${run.changes?.files ?? 0}|${run.changes?.insertions ?? 0}`;
  if (first || S.changesFor !== changesKey) { S.changesFor = changesKey; renderChanges(run); }  // patch only refetched when it changed

  const tl = $("tab-timeline");
  for (const e of events) {
    S.lastEvent = e.id;
    if (e.kind === "tool_use") { addToGroup(tl, e); continue; }
    if (e.kind === "thinking" && !(e.detail.text || "").trim()) continue;
    if (e.kind === "mcp_result") {  // attach the result size to the matching call row
      const rows = [...tl.querySelectorAll(".ev.k-mcp_call .mcp-size:empty")];
      const row = rows.find((r) => r.closest(".ev").dataset.key === `${e.detail.server}.${e.detail.tool}`);
      if (row) row.textContent = ` · 결과 ${fmtN(e.detail.chars)}자${e.detail.is_error ? " · 오류" : ""}`;
      continue;
    }
    S.group = null;
    const [ic, label] = EV[e.kind] || ["•", e.kind];
    const key = e.kind === "mcp_call" ? `${e.detail.server}.${e.detail.tool}` : "";
    const say = { note: "say", thinking: "say clip", stage_answer: "say answer", user_interject: "say me" }[e.kind] || "";
    tl.insertAdjacentHTML("beforeend", `
      <div class="ev k-${e.kind} ${say}" data-key="${esc(key)}"><div class="ic">${ic}</div>
        <div class="body"><div class="top"><span class="kind">${label}</span>${e.stage !== "-" ? `<span class="stage">${esc(e.stage)}</span>` : ""}<span class="time">${e.at.slice(11, 19)}</span></div>
        <div class="desc">${describe(e)}</div></div></div>`);
  }
  if (first || events.length) renderSummary(runId);
  if (!tl.children.length) tl.innerHTML = `<div class="empty"><div class="big">⏳</div>기록 대기 중…</div>`;
  else tl.querySelector(".empty")?.remove();

  if (first || events.length) {
    $("tab-handoff").innerHTML = md(await api(`/runs/${runId}/handoff`));
    renderUsage(run);
  }
  const settled = ["done", "failed", "cancelled", "awaiting_approval"].includes(run.status);
  if (settled && !first && !events.length && S.timer) {
    S.timer = clearInterval(S.timer);
    if (S.session) openSession(S.session);
  }
}

async function renderUsage(run) {
  const h = run.history;
  let watch = { stages: [] };
  try { watch = await api(`/runs/${run.id}/tokens`); } catch {}
  if (!h.length && !watch.stages.length) { $("tab-usage").innerHTML = `<div class="empty"><div class="big">📊</div>아직 사용량이 없습니다</div>`; return; }
  const stageHtml = watch.stages.map((s) => {
    const u = s.usage || {}, r = s.report || {}, p = s.prompt || {};
    const maxCtx = Math.max(1, ...(r.contexts || [0]));
    return `<div class="tw-stage">
      <h4>${STAGE_IC[s.stage] || "◆"} ${esc(s.stage)}
        <span class="muted">새 입력 ${fmtN(u.input || 0)} · 캐시 쓰기 ${fmtN(u.cache_write || 0)} · 캐시 읽기 ${fmtN(u.cache_read || 0)} (10% 과금) · 출력 ${fmtN(u.output || 0)} · ${fmt$(u.cost_usd || 0)}</span></h4>
      ${s.digest ? `<div class="muted">📚 문서 요약(digest) 호출: 새 입력 ${fmtN(s.digest.input + s.digest.cache_write)} · 출력 ${fmtN(s.digest.output)} · ${fmt$(s.digest.cost_usd)} — 원문 대신 요약만 맥락에 들어감</div>` : ""}
      ${(s.warnings || []).map((w) => `<div class="tw-warn">⚠️ ${esc(w)}</div>`).join("") || '<div class="muted">✅ 눈에 띄는 누수 없음</div>'}
      ${p.est_tokens ? `<div class="muted">📤 보낸 프롬프트 약 ${fmtN(p.est_tokens)} 토큰 — ${Object.entries(p.sections || {}).slice(0, 4).map(([k, v]) => `${esc(k)} ${fmtN(v)}자`).join(" · ")}</div>` : ""}
      ${r.turns ? `<div class="muted">🔁 턴 ${r.turns}회 — 턴마다 아래 크기의 맥락을 통째로 다시 읽음 (합계 ${fmtN(r.reread_tokens)})</div>
        <div class="tw-spark" title="턴별 맥락 크기">${r.contexts.map((c) => `<i style="height:${(c / maxCtx * 100).toFixed(0)}%" title="${fmtN(c)}"></i>`).join("")}</div>` : ""}
      ${(r.top_results || []).length ? `<table class="tw-table">${r.top_results.slice(0, 5).map((x) => `<tr><td>${TOOL_IC[x.tool] || "🛠️"} <code>${esc(x.tool)}</code> <code>${esc(x.target || "")}</code></td><td class="n">${fmtN(x.chars)}자</td></tr>`).join("")}</table>` : ""}
    </div>`;
  }).join("");
  if (!h.length) { $("tab-usage").innerHTML = stageHtml; return; }
  const max = Math.max(...h.map((x) => x.total_input + x.output_tokens));
  $("tab-usage").innerHTML = `<div class="bars">${h.map((x) => `
    <div class="bar-row"><div class="top"><span>${STAGE_IC[x.stage] || "◆"} <b>${esc(x.stage)}</b> <span class="tag">${esc(x.model)}</span></span><b>${fmtN(x.total_input)} in · ${fmtN(x.output_tokens)} out · ${x.cost_usd != null ? fmt$(x.cost_usd) : "-"}</b></div>
    <div class="bar-track"><div class="bar-fill" style="width:${((x.total_input + x.output_tokens) / max * 100).toFixed(1)}%"></div></div></div>`).join("")}</div>
    <p class="label" style="margin-top:16px">토큰 감시 — 어디서 새는지</p>${stageHtml || '<div class="muted">이 실행에는 상세 기록이 없습니다 (이전 버전에서 실행)</div>'}`;
}

/* changes (workspace patch) */
async function renderChanges(run) {
  const box = $("tab-changes");
  if (run.workspace_mode === "none") {
    box.innerHTML = `<div class="empty"><div class="big">🗂️</div>이 실행은 작업 공간 없이(읽기 전용) 돌았습니다</div>`; return;
  }
  const c = run.changes;
  if (!c || !c.files) {
    box.innerHTML = `<div class="empty"><div class="big">🧾</div>${run.status === "running" ? "작업 중… 단계가 끝나면 변경 사항이 모입니다" : "변경된 파일이 없습니다"}</div>`; return;
  }
  const status = { ready: "", applied: "✅ 원본에 적용됨", discarded: "🗑️ 폐기됨 (패치 파일은 보관)", rolled_back: "⏪ 실행 전 상태로 되돌림" }[run.changes_status];
  const actions = run.changes_status !== "ready" || !["done", "cancelled"].includes(run.status) ? `<span class="tag">${status || "릴레이가 끝나면(완료·취소) 적용할 수 있습니다"}</span>`
    : run.workspace_mode === "copy"
      ? `<button class="btn btn-primary" id="applyCh">✅ 원본에 적용</button><button class="btn btn-ghost" id="discardCh">🗑️ 폐기</button>`
      : `<span class="tag">원본에 이미 반영됨</span><button class="btn btn-ghost" id="rollbackCh">⏪ 실행 전으로 되돌리기</button>`;
  const patch = await api(`/runs/${run.id}/patch`);
  const lines = patch.split("\n").slice(0, 4000).map((l) => {
    const cls = l.startsWith("diff --git") ? "file" : l.startsWith("@@") ? "hunk" : l.startsWith("+") && !l.startsWith("+++") ? "add" : l.startsWith("-") && !l.startsWith("---") ? "del" : "";
    return `<div class="${cls}">${esc(l) || " "}</div>`;
  }).join("");
  box.innerHTML = `
    <div class="changes-bar"><b>${c.files}개 파일</b><span class="num-add">+${c.insertions}</span><span class="num-del">-${c.deletions}</span>
      <span class="tag">${run.workspace_mode === "copy" ? "📦 복사본" : "✏️ 원본"}</span>${c.vcs ? `<span class="tag">${esc(c.vcs)}</span>` : ""}<span style="flex:1"></span>${actions}</div>
    ${(c.binary || []).length ? `<div class="card" style="margin-bottom:10px"><h4>🎨 바이너리·에셋 변경 <span class="count">${c.binary.length}</span></h4>
      ${c.binary.map((b) => `<div class="check" style="cursor:default"><span>${b.restorable ? "✅" : "⚠️"}</span><span><code>${esc(b.path)}</code>
        <span style="color:var(--muted)">${b.before_bytes == null ? "새 파일" : fmtN(b.before_bytes) + "B"} → ${b.after_bytes == null ? "삭제됨" : fmtN(b.after_bytes) + "B"}
        · ${b.asset ? "에셋(보관 안 함) · " : ""}${b.restorable ? `되돌리기 가능 (${{ backup: "편집 전 백업", pristine: "VCS 원본", absent: "새로 생긴 파일" }[b.source] || esc(b.source)})` : "원본 보관 안 함 — VCS 로 복구"}</span></span></div>`).join("")}</div>` : ""}
    <div class="diff">${lines}</div>`;
  const act = (path, msg, ask) => () => (!ask || confirm(ask)) && api(`/runs/${run.id}/changes/${path}`, { method: "POST" })
    .then((r) => { toast(msg); renderChanges(r); }).catch((e) => toast(e.message, true));
  if ($("applyCh")) $("applyCh").onclick = act("apply", "✅ 원본 폴더에 적용했습니다");
  if ($("discardCh")) $("discardCh").onclick = act("discard", "🗑️ 폐기했습니다", "변경 사항을 폐기할까요? (패치 파일은 남습니다)");
  if ($("rollbackCh")) $("rollbackCh").onclick = act("rollback", "⏪ 실행 전 상태로 되돌렸습니다", "릴레이가 바꾼 파일을 실행 전 상태로 되돌리고, 새로 만든 파일은 지웁니다. 계속할까요?");
}

/* provider usage strip */
async function loadProviders() {
  let list;
  try { list = await api("/providers"); } catch { return; }
  $("quota").innerHTML = list.map((p) => {
    const wins = (p.limits || []).filter((w) => w.utilization != null);
    const hot = wins.some((w) => w.gating !== false && w.utilization >= 0.8);
    const winHtml = wins.length ? `<div class="wins">${wins.map((w) => {
      const pct = Math.round(w.utilization * 100);
      const reset = w.resets_at ? new Date(w.resets_at * 1000).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
      return `<div class="win" style="${w.gating === false ? "opacity:.55" : ""}" title="초기화 ${reset}${w.gating === false ? " · 참고용 (전체 사용량이 아니라 AI 교체 기준에서 제외)" : ""}"><span>${WINDOW_LABEL[w.window] || esc(w.window.replace("seven_day", "7d").replace("five_hour", "5h"))}</span><span class="meter"><i style="width:${pct}%;background-position:${-pct}px 0"></i></span><b>${pct}%</b></div>`;
    }).join("")}</div>` : "";
    const spent = p.usage_24h?.cost_usd ? ` · 24h ${fmt$(p.usage_24h.cost_usd)}` : "";
    const benched = (p.exhausted_models || []).map((m) => `${m.model} 소진~${new Date(m.until).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}`).join(" · ");
    const sub = p.available ? (benched ? `${esc(benched)} → 아래 모델 사용${spent}` : wins.length ? `남은 사용량${spent}` : `사용 가능${spent}`) : esc(p.reason);
    return `<div class="q ${p.available ? "on" : "off"} ${hot ? "hot" : ""}" data-name="${p.name}" title="${esc(p.reason || "")}">
      <span class="dot"></span><div><div class="nm">${esc(PROVIDER_LABEL[p.name] || p.label)}</div><div class="sub">${sub}</div></div>${winHtml}</div>`;
  }).join("");
  document.querySelectorAll(".q").forEach((el) => el.onclick = async () => {
    const name = el.dataset.name;
    if (el.classList.contains("off") && el.title.includes("대기")) {
      if (!confirm(`${name} 의 사용량 소진 표시를 지울까요?`)) return;
      await api(`/providers/${name}/reset`, { method: "POST" });
    } else if (name === "claude") {
      toast("Claude 사용량 확인 중… (Haiku 짧은 호출 1회)");
      await api(`/providers/${name}/probe`, { method: "POST" }).catch((e) => toast(e.message, true));
    }
    loadProviders();
  });
}

/* folder picker (server lists this PC's folders; no typing paths) */
function pickFolder(start) {
  return new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `<div class="glass modal"><h3>📂 폴더 선택</h3>
      <div class="picker-path" id="pkPath">-</div>
      <div class="row" style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn btn-ghost" id="pkUp">⬆ 상위 폴더</button>
        <button class="btn btn-ghost" id="pkTop">🏠 처음</button>
        <span style="flex:1"></span>
        <button class="btn btn-ghost" id="pkCancel">취소</button>
        <button class="btn btn-primary" id="pkOk" disabled>이 폴더 선택</button>
      </div>
      <div class="picker-list" id="pkList"></div></div>`;
    document.body.appendChild(bg);
    let current = null, parent = null;
    const close = (value) => { bg.remove(); resolve(value); };
    async function go(path) {
      let data;
      try { data = await api("/fs/list" + (path ? `?path=${encodeURIComponent(path)}` : "")); }
      catch (e) { return toast(e.message, true); }
      current = data.path; parent = data.parent;
      bg.querySelector("#pkPath").innerHTML = current
        ? `${esc(current)} ${data.is_repo ? '<span class="tag">git</span>' : ""}${data.registered ? ` <span class="tag">등록됨: ${esc(data.registered)}</span>` : ""}`
        : "드라이브 또는 바로가기를 고르세요";
      bg.querySelector("#pkOk").disabled = !current;
      bg.querySelector("#pkUp").disabled = !parent;
      bg.querySelector("#pkList").innerHTML = data.dirs.map((d) => `<div data-p="${esc(d.path)}">📁 ${esc(d.name)}</div>`).join("")
        || `<div style="color:var(--muted);cursor:default">하위 폴더 없음</div>`;
      bg.querySelectorAll("#pkList [data-p]").forEach((el) => el.onclick = () => go(el.dataset.p));
    }
    bg.querySelector("#pkUp").onclick = () => parent && go(parent);
    bg.querySelector("#pkTop").onclick = () => go(null);
    bg.querySelector("#pkCancel").onclick = () => close(null);
    bg.querySelector("#pkOk").onclick = () => close(current);
    bg.onclick = (e) => { if (e.target === bg) close(null); };
    go(start || null);
  });
}

    const f = Object.fromEntries(new FormData(form));
    try {
      await api("/repos", { method: "POST", body: JSON.stringify({
        name: f.name, path: folder, workspace: f.workspace, notes: f.notes,
        verify: f.verify.split("\n").map((v) => v.trim()).filter(Boolean) }) });
      toast(`📁 ${f.name} 등록`); bg.remove(); await loadRepos(); $("repoSelect").value = f.name;
    } catch (e) { toast(e.message, true); }
  };
};

/* resizable, collapsible layout (remembered per browser) */
const LAYOUT_KEY = "katae-layout";
let L = { w1: 280, w2: null, h: {}, left: true, mid: true };
try { L = { ...L, ...JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}") }; } catch {}
function saveLayout() { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(L)); } catch {} }
function applyLayout() {
  const app = $("app");
  $("colLeft").classList.toggle("collapsed", !L.left);
  $("colMid").classList.toggle("collapsed", !L.mid);
  const cols = [
    L.left ? `${L.w1}px` : "0px", L.left ? "14px" : "0px",
    L.mid ? (L.w2 ? `${L.w2}px` : "minmax(320px, 1fr)") : "0px", L.mid ? "14px" : "0px",
    "minmax(360px, 1.15fr)",
  ];
  app.style.gridTemplateColumns = cols.join(" ");
  // hide, don't remove: a display:none grid item would shift every later column into the wrong track
  document.querySelector('[data-split="1"]').style.visibility = L.left ? "" : "hidden";
  document.querySelector('[data-split="2"]').style.visibility = L.mid ? "" : "hidden";
  for (const [id, h] of Object.entries(L.h)) { const el = $(id); if (el) { el.style.flex = h ? `0 0 ${h}px` : "0 0 auto"; } }
  $("tgLeft").classList.toggle("on", !L.left);
  $("tgMid").classList.toggle("on", !L.mid);
  $("tgFocus").classList.toggle("on", !L.left && !L.mid);
}
document.querySelectorAll(".split").forEach((sp) => {
  sp.onpointerdown = (ev) => {
    ev.preventDefault();
    try { sp.setPointerCapture(ev.pointerId); } catch {}
    sp.classList.add("drag"); document.body.classList.add("dragging");
    const which = sp.dataset.split;
    const startX = ev.clientX;
    const start = which === "1" ? $("colLeft").getBoundingClientRect().width : $("colMid").getBoundingClientRect().width;
    sp.onpointermove = (m) => {
      const w = Math.max(200, Math.min(window.innerWidth - 520, start + m.clientX - startX));
      if (which === "1") L.w1 = Math.round(w); else L.w2 = Math.round(w);
      applyLayout();
    };
    sp.onpointerup = () => {
      sp.onpointermove = null; sp.classList.remove("drag"); document.body.classList.remove("dragging"); saveLayout();
    };
  };
  sp.ondblclick = () => { if (sp.dataset.split === "1") L.w1 = 280; else L.w2 = null; applyLayout(); saveLayout(); };
});
document.querySelectorAll(".vsplit").forEach((sp) => {
  sp.onpointerdown = (ev) => {
    ev.preventDefault();
    try { sp.setPointerCapture(ev.pointerId); } catch {}
    const target = $(sp.dataset.target);
    const startY = ev.clientY, start = target.getBoundingClientRect().height;
    sp.classList.add("drag"); document.body.classList.add("dragging-row");
    sp.onpointermove = (m) => {
      const colH = target.parentElement.getBoundingClientRect().height;
      L.h[sp.dataset.target] = Math.round(Math.max(80, Math.min(colH - 140, start + m.clientY - startY)));
      applyLayout();
    };
    sp.onpointerup = () => {
      sp.onpointermove = null; sp.classList.remove("drag"); document.body.classList.remove("dragging-row"); saveLayout();
    };
  };
  sp.ondblclick = () => { delete L.h[sp.dataset.target]; $(sp.dataset.target).style.flex = "0 0 auto"; saveLayout(); };
});
$("tgLeft").onclick = () => { L.left = !L.left; applyLayout(); saveLayout(); };
$("tgMid").onclick = () => { L.mid = !L.mid; applyLayout(); saveLayout(); };
$("tgFocus").onclick = () => { const focus = L.left || L.mid; L.left = L.mid = !focus; applyLayout(); saveLayout(); };
$("tgReset").onclick = () => { L = { w1: 280, w2: null, h: {}, left: true, mid: true }; ["runPanel", "sessionPanel"].forEach((id) => $(id).style.flex = "0 0 auto"); applyLayout(); saveLayout(); };
applyLayout();

/* tabs, search, new session */
$("tabs").onclick = (ev) => {
  const b = ev.target.closest(".tab"); if (!b) return;
  S.tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t === b));
  for (const name of ["summary", "timeline", "handoff", "changes", "usage"]) $("tab-" + name).hidden = name !== S.tab;
};
$("search").onkeydown = async (ev) => {
  const q = ev.target.value.trim();
  if (ev.key !== "Enter" || !q) return;
  const hits = await api(`/history/search?q=${encodeURIComponent(q)}`);
  $("turnsLabel").firstChild.textContent = `"${q}" 검색 결과 `;
  renderTurns(hits);
};
async function loadRepos() {
  let repos = [];
  try { repos = await api("/repos"); } catch { return; }
  S.repos = repos;
  $("repoSelect").innerHTML = `<option value="">📁 등록된 저장소 선택…</option>` + repos.map((r) =>
    `<option value="${esc(r.name)}" ${r.exists ? "" : "disabled"}>${esc(r.name)}${r.branch ? ` · ${esc(r.branch)}` : ""}${r.dirty ? ` · 미커밋 ${r.dirty}` : ""}${r.exists ? "" : " (경로 없음)"}</option>`).join("");
}
loadRepos();

$("newSession").onsubmit = async (ev) => {
  ev.preventDefault();
  const body = Object.fromEntries(new FormData(ev.target));
  if (!body.repo && !body.workdir) return toast("저장소를 고르거나 폴더를 선택하세요", true);
  for (const k of ["repo", "workdir"]) if (!body[k]) delete body[k];
  try {
    const s = await api("/sessions", { method: "POST", body: JSON.stringify(body) });
    ev.target.reset(); $("workdirValue").value = ""; $("workdirLabel").textContent = ""; $("workdirLabel").hidden = true;
    toast("🌱 세션 시작"); openSession(s.id);
  } catch (e) { toast(e.message, true); }
};

loadSessions(); loadStats(); loadProviders();
setInterval(loadProviders, 30000);
</script>
</body>
