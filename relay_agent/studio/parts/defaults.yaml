# 기본 네 파트의 기본값 — 사람이 읽고 고치는 원본이다 (design/studio/ARCHITECTURE.md §3.4 · §3.15 · §9.2).
# 인사 파트의 것은 ../hr/employee.yaml 에 있다.
#
# 서버가 시작할 때 각 파트 행의 빈 칸만 이 값으로 채운다. 값이 있는 칸은 덮어쓰지 않는다 — 이미 도는
# 스튜디오의 값은 PATCH /studio/departments/{id} 로 고친다.
#
#   mcp   작업 런에 붙일 MCP 서버 이름. studio 는 서버가 항상 붙이므로 적지 않는다
#   chat  채팅 턴의 모델 · 노력치
#   work  작업 런의 단계별 모델 · 노력치. 단계 이름은 그 파트의 릴레이(relays/<이름>.yaml)에 있는 것이다
#   cap   이 파트 직원의 상한. chat · work 는 이 값을 넘지 못한다
#
# 직원의 employee.yaml 이 적지 않은 키가 이 값을 따른다. 기본 릴레이는 여기 없고 schema.py 의 시드에 있다
# (design_doc = doc-write, program = auto, design_setup = editor-task, art = editor-task).
#
# 알아 둘 것:
# - unreal 은 서버에 내장된 MCP 가 아니다. 프로젝트의 .mcp.json 이나 relay.config 의 mcp_servers 에 있어야 붙고,
#   어디에도 없으면 런에 mcp_missing 이벤트만 남는다. 파트의 mcp 는 저장할 때 MCP 레지스트리와 대조하지 않는다.
# - mcp 에 unreal 이 있으면 mcp_port 가 있는 프로젝트의 작업 런은 진행하기 전에 에디터 검사(M-7)를 받는다.
#   서버가 에디터를 켜고 답을 기다리며(설정의 studio_editor_wait 초), 켜지 못하거나 답이 없으면 런을 진행하지
#   않는다 — 작업은 blocked 가 되고 결재함에 editor_unresponsive 가 올라온다.
# - 채움은 칸 단위다. mcp 를 비워([]) 두어도 다음 시작에 다시 채워진다. chat · work · cap 은 한 칸
#   (default_models)이라 셋이 모두 비었을 때만 통째로 채워진다 — chat 만 적어 둔 파트에 work · cap 은 안 채워진다.

design_doc:  # 기획(문서) — relays/doc-write.yaml: outline → write → review
  mcp: [docs_read]
  chat: {model: sonnet, effort: medium}
  work:
    outline: {model: opus, effort: medium}
    write: {model: sonnet, effort: medium}
    review: {model: sonnet, effort: low}
  cap: {model: opus, effort: high}

program:  # 프로그램 — auto 가 고르는 relays/studio-task.yaml: scout → plan → build → review
  mcp: [unreal]
  chat: {model: sonnet, effort: medium}
  work:  # "*" 는 두지 않는다 — auto 가 다른 릴레이를 고르면 그 릴레이의 단계별 값이 그대로 쓰인다
    scout: {model: sonnet, effort: low}
    plan: {model: opus, effort: high}
    build: {model: sonnet, effort: medium}
    review: {model: opus, effort: medium}
  cap: {model: opus, effort: high}

design_setup:  # 기획(세팅) — relays/editor-task.yaml: edit → verify
  mcp: [unreal]
  chat: {model: sonnet, effort: medium}
  work:
    edit: {model: sonnet, effort: medium}
    verify: {model: sonnet, effort: low}
  cap: {model: opus, effort: high}

art:  # 아트 — relays/editor-task.yaml: edit → verify (선택 파트라 직원이 없어도 괜찮다)
  mcp: [unreal]
  chat: {model: sonnet, effort: medium}
  work:
    edit: {model: sonnet, effort: medium}
    verify: {model: sonnet, effort: low}
  cap: {model: opus, effort: high}
